<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Análisis de Relatos de Bolivia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Listado de Relatos</h1>
        <a href="/adicionar" class="btn btn-success">+ Adicionar Relato</a>
    </div>

    <div class="card p-3 mb-4 shadow-sm">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="filtroDepartamento" class="form-label">Departamento</label>
                <select id="filtroDepartamento" class="form-select">
                    <option value="">Todos los departamentos</option>
                    <option value="Pando">Pando</option>
                    <option value="La Paz">La Paz</option>
                    <option value="Beni">Beni</option>
                    <option value="Oruro">Oruro</option>
                    <option value="Cochabamba">Cochabamba</option>
                    <option value="Santa Cruz">Santa Cruz</option>
                    <option value="Potosi">Potosi</option>
                    <option value="Chuquisaca">Chuquisaca</option>
                    <option value="Tarija">Tarija</option>
                </select>
            </div>

            <div class="col-md-5">
                <label for="filtroAutor" class="form-label">Autor</label>
                <input type="text" id="filtroAutor" class="form-control" placeholder="Buscar por nombre de autor...">
            </div>

            <div class="col-md-2 d-grid">
                <button type="button" id="limpiarFiltros" class="btn btn-outline-secondary">Limpiar</button>
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover" id="tablaRelatos">
        <thead>
            <tr>
                <th>Título</th>
                <th>Departamento</th>
                <th>Autor</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for reg in registros %}
            <tr class="fila-relato"
                data-departamento="{{ reg.departamento | lower }}"
                data-autor="{{ reg.autor | lower }}">
                <td>{{ reg.titulo }}</td>
                <td>{{ reg.departamento }}</td>
                <td>{{ reg.autor }}</td>
                <td>
                    <a href="/relato/{{ reg.id }}" class="btn btn-sm btn-primary">Ver resultados</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p id="sinResultados" class="text-center text-muted mt-3 d-none">
        No se encontraron relatos que coincidan con los filtros seleccionados.
    </p>

    <script src="{{ url_for('static', filename='functions.js') }}"></script>
</body>
</html>
