<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Relato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Adicionar Nuevo Relato</h1>
        <a href="/" class="btn btn-secondary">&larr; Volver al listado</a>
    </div>

    <div class="card p-4 shadow-sm">
        <form action="/adicionar" method="POST">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" required>
            </div>

            <div class="mb-3">
                <label for="departamento" class="form-label">Departamento</label>
                <select class="form-select" id="departamento" name="departamento" required>
                    <option value="" selected disabled>Selecciona un departamento...</option>
                    <option value="Pando">Pando</option>
                    <option value="La Paz">La Paz</option>
                    <option value="Beni">Beni</option>
                    <option value="Oruro">Oruro</option>
                    <option value="Cochabamba">Cochabamba</option>
                    <option value="Santa Cruz">Santa Cruz</option>
                    <option value="Potosi">Potosi</option>
                    <option value="Chuquisaca">Chuquisaca</option>
                    <option value="Tarija">Tarija</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="texto" class="form-label">Texto del Relato</label>
                <textarea class="form-control" id="texto" name="texto" rows="7" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar y Analizar</button>
        </form>
    </div>
</body>
</html>
