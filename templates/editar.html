<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar - {{ relato.titulo }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Editar Relato</h1>
        <a href="/relato/{{ relato.id }}" class="btn btn-secondary">&larr; Cancelar</a>
    </div>

    <div class="card p-4 shadow-sm">
        <form action="/relato/{{ relato.id }}/editar" method="POST">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ relato.titulo }}" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" value="{{ relato.autor }}" required>
            </div>

            <div class="mb-3">
                <label for="departamento" class="form-label">Departamento</label>
                <select class="form-select" id="departamento" name="departamento" required>
                    {% for dep in departamentos %}
                        <option value="{{ dep }}" {% if dep == relato.departamento %}selected{% endif %}>{{ dep }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="texto" class="form-label">Texto del Relato</label>
                <textarea class="form-control" id="texto" name="texto" rows="8" required>{{ relato.texto }}</textarea>
            </div>

            <button type="submit" class="btn btn-success">Guardar cambios</button>
        </form>
    </div>
</body>
</html>
